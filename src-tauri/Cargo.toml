[package]
name = "chechevica"
authors = ["Kirill Samoilov <rookhive@gmail.com>"]
edition = "2024"

[lib]
name = "chechevica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
ureq = { version = "3.3.0", default-features = true }
zip = { version = "8.5.1", default-features = false, features = ["deflate"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
sha2 = "0.11.0"
hex = "0.4.3"

[dependencies]
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-opener = "2.5.3"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-prevent-default = { version = "4.0.4", features = ["platform-windows"] }
tauri-plugin-single-instance = "2.4.1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-process = "2.3.1"
async-trait = "0.1.89"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1.51.1", features = ["full"] }
uuid = { version = "1.23.0", features = ["v7", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.33"
infer = "0.19.0"
anyhow = "1.0.102"
ts-rs = "12.0.1"
colored = "3.1.1"
tokio-util = "0.7.18"
qdrant-client = "1.17.0"
tantivy = "0.26.0"
ureq = { version = "3.3.0", default-features = true }
sha2 = "0.11.0"
hex = "0.4.3"
hf-hub = "0.5.0"
# `cpu` feature dependencies
fastembed = { version = "5.13.2", optional = true }
# `cuda` feature dependencies
mistralrs = { version = "0.8.1", optional = true, features = ["cuda"] }

[features]
default = ["cpu"]
cpu = ["dep:fastembed"]
cuda = ["dep:mistralrs"]
