name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: [self-hosted, Windows, X64]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL: sqlite:db.sqlite
      CUDA_PATH: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8
      CUDNN_PATH: C:\Program Files\NVIDIA\CUDNN\v9.20\bin\12.9\x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          set-safe-directory: false
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean
        run: |
          $releaseDir = 'src-tauri/target/release'

          if (Test-Path 'src-tauri/db.sqlite') {
            Remove-Item 'src-tauri/db.sqlite' -Force -ErrorAction SilentlyContinue
          }

          if (Test-Path 'src-tauri/dll') {
            Get-ChildItem 'src-tauri/dll/*.dll' -Force -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          }

          if (Test-Path $releaseDir) {
            Get-ChildItem $releaseDir -File -Recurse -Force -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

      - name: Generate DB for sqlx compile-time checks
        run: pnpm generate:db

      - name: Generate contract types
        run: pnpm generate:types:release

      - name: Build app (CPU version)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build:cpu

      - name: Copy CUDA DLLs
        run: |
          $ErrorActionPreference = 'Stop'

          $cudaDlls = @(
            'cublas64_12.dll',
            'cublasLt64_12.dll',
            'cudart64_12.dll',
            'curand64_10.dll'
          )

          $cudnnDlls = @(
            'cudnn64_9.dll'
          )

          $targetDir = 'src-tauri/dll'
          $cudaBinDir = Join-Path $env:CUDA_PATH 'bin'

          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null

          foreach ($dll in $cudaDlls) {
            $source = Join-Path $cudaBinDir $dll
            if (-not (Test-Path $source)) {
              throw "Missing CUDA DLL: $source"
            }

            Copy-Item $source -Destination (Join-Path $targetDir $dll) -Force
          }

          foreach ($dll in $cudnnDlls) {
            $source = Join-Path $env:CUDNN_PATH $dll
            if (-not (Test-Path $source)) {
              throw "Missing cuDNN DLL: $source"
            }

            Copy-Item $source -Destination (Join-Path $targetDir $dll) -Force
          }

      - name: Build app (CUDA version)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build:cuda

      - name: Rename bundles
        run: |
          $ErrorActionPreference = 'Stop'

          $bundleMsiDir = 'src-tauri/target/release/bundle/msi'
          $installers = Get-ChildItem $bundleMsiDir -Filter '*.msi' -File

          if (-not $installers) {
            throw 'Missing MSI bundles'
          }

          foreach ($installer in $installers) {
            $sanitizedName = $installer.Name.Replace(' ', '_').Replace('(', '').Replace(')', '')
            if ($sanitizedName -eq $installer.Name) {
              continue
            }

            $oldInstallerPath = $installer.FullName
            Rename-Item $oldInstallerPath -NewName $sanitizedName

            $oldSignaturePath = "$oldInstallerPath.sig"
            if (Test-Path $oldSignaturePath) {
              Rename-Item $oldSignaturePath -NewName "$sanitizedName.sig"
            }
          }

      - name: Generate updater manifests
        run: |
          $ErrorActionPreference = 'Stop'

          $bundleMsiDir = 'src-tauri/target/release/bundle/msi'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $releaseBaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
          $pubDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')

          $cpuInstaller = Get-ChildItem $bundleMsiDir -Filter '*.msi' -File |
            Where-Object { $_.Name -notmatch 'CUDA' } |
            Select-Object -First 1
          if (-not $cpuInstaller) {
            throw 'Missing CPU MSI bundle'
          }

          $cudaInstaller = Get-ChildItem $bundleMsiDir -Filter '*.msi' -File |
            Where-Object { $_.Name -match 'CUDA' } |
            Select-Object -First 1
          if (-not $cudaInstaller) {
            throw 'Missing CUDA MSI bundle'
          }

          function New-ReleaseManifest($installerName, $signaturePath) {
            if (-not (Test-Path $signaturePath)) {
              throw "Missing MSI signature: $signaturePath"
            }

            $signature = (Get-Content $signaturePath -Raw).Trim()
            $encodedInstallerName = [System.Uri]::EscapeDataString($installerName)
            $platform = @{
              url = "$releaseBaseUrl/$encodedInstallerName"
              signature = $signature
            }

            return [ordered]@{
              version = $version
              pub_date = $pubDate
              platforms = [ordered]@{
                'windows-x86_64' = $platform
              }
            }
          }

          function Write-Utf8NoBomJson($path, $value) {
            $json = $value | ConvertTo-Json -Depth 6
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($path, $json, $utf8NoBom)
          }

          $cpuManifest = New-ReleaseManifest -installerName $cpuInstaller.Name -signaturePath "$($cpuInstaller.FullName).sig"
          $cudaManifest = New-ReleaseManifest -installerName $cudaInstaller.Name -signaturePath "$($cudaInstaller.FullName).sig"

          Write-Utf8NoBomJson -path (Join-Path $bundleMsiDir 'latest.cpu.json') -value $cpuManifest
          Write-Utf8NoBomJson -path (Join-Path $bundleMsiDir 'latest.cuda.json') -value $cudaManifest

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/latest.cpu.json
            src-tauri/target/release/bundle/msi/latest.cuda.json
          overwrite_files: true
